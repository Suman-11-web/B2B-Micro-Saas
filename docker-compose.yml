services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: b2b-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-b2b}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-b2bpassword}
      POSTGRES_DB: ${DB_NAME:-b2b}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: b2b-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-redispassword} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: b2b-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: b2b-api
    env_file:
      - ./services/api/.env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-b2b}:${DB_PASSWORD:-b2bpassword}@postgres:5432/${DB_NAME:-b2b}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379/1
      S3_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: b2b-worker
    command: celery -A config worker --loglevel=info
    env_file:
      - ./services/api/.env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-b2b}:${DB_PASSWORD:-b2bpassword}@postgres:5432/${DB_NAME:-b2b}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379/1
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
