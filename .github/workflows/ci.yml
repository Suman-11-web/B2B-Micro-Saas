name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  security-events: write

jobs:
  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck frontend
        run: pnpm typecheck
        working-directory: ./apps/web

      - name: Build frontend
        run: pnpm build
        working-directory: ./apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  backend-test:
    name: Backend Checks, Migrations & E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: b2b
          POSTGRES_PASSWORD: b2bpassword
          POSTGRES_DB: b2b
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U b2b -d b2b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/api/requirements.txt

      - name: Install system & Python dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libmagic1
          pip install -q -r services/api/requirements.txt

      - name: Syntax check all Python files
        run: |
          find services/api services/llm-stack -name "*.py" -print0 | xargs -0 python -m py_compile

      - name: Django system check & migrations
        working-directory: ./services/api
        env:
          DEBUG: 'True'
          USE_LOCAL_STORAGE: 'True'
          DJANGO_SETTINGS_MODULE: config.settings
          DATABASE_URL: postgresql://b2b:b2bpassword@localhost:5432/b2b
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          JWT_SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
          OPENAI_API_KEY: sk-your-ci-placeholder-key
        run: |
          python manage.py check
          python manage.py migrate --noinput
          echo "n" | python seed.py

      - name: Run API smoke & security checks
        working-directory: ./services/api
        env:
          DEBUG: 'True'
          USE_LOCAL_STORAGE: 'True'
          DJANGO_SETTINGS_MODULE: config.settings
          DATABASE_URL: postgresql://b2b:b2bpassword@localhost:5432/b2b
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          JWT_SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
          OPENAI_API_KEY: sk-your-ci-placeholder-key
        run: |
          python -c "
          import os, django
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          django.setup()
          from rest_framework.test import APIClient
          c = APIClient()
          for url in ['/health/', '/health/ready/', '/api/v1/plans/']:
              r = c.get(url, HTTP_HOST='localhost')
              assert r.status_code == 200, (url, r.status_code, r.content)
          print('CI API smoke checks passed!')
          "

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Bandit (Python security)
        run: |
          pip install -q bandit
          bandit -r services/api/apps -ll || true

  docker-build:
    name: Verify API Docker Build
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          push: false
          tags: b2b-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
